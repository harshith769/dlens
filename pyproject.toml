[project]
name = "dlens-lineage"
version = "0.0.1"
description = "Column-level lineage for dbt projects, with an LLM agent that cites file and line for every step."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "dbt-core==1.12.5",
    "dbt-duckdb==1.11.0",
    "sqlglot==30.21.0",
    "networkx",
    "typer",
    "pydantic",
    "pydantic-settings",
    "structlog",
]

[project.optional-dependencies]
agent = ["google-genai", "ollama", "groq"]
retrieval = ["lancedb", "bm25s", "sentence-transformers"]
ui = ["streamlit"]

[project.scripts]
dlens = "dlens.cli:app"

[dependency-groups]
dev = ["pytest", "hypothesis", "ruff", "mypy", "pre-commit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dlens"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["docs", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src/dlens"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["dlens.graph.*", "dlens.agent.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: runs dbt end to end on a vendored corpus"]
