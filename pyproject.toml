[project]
name = "dlens-lineage"
version = "0.1.0"
description = "Column-level lineage for dbt projects: trace any column to its source and see what a change affects."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Harshith" }]
keywords = ["dbt", "lineage", "column-level-lineage", "sqlglot", "duckdb", "data-engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "dbt-core>=1.12,<1.13",
    "dbt-duckdb>=1.11,<1.12",
    "sqlglot>=30.21,<31",
    "networkx",
    "typer",
    "pydantic",
    "pydantic-settings",
    "structlog",
]

[project.optional-dependencies]
agent = ["google-genai", "ollama", "groq"]
retrieval = ["lancedb", "bm25s", "sentence-transformers"]
ui = ["streamlit"]

[project.urls]
Homepage = "https://github.com/harshith769/dlens"
Source = "https://github.com/harshith769/dlens"
Issues = "https://github.com/harshith769/dlens/issues"
Changelog = "https://github.com/harshith769/dlens/blob/main/CHANGELOG.md"

[project.scripts]
dlens = "dlens.cli:app"

[dependency-groups]
dev = ["pytest", "hypothesis", "ruff", "mypy", "pre-commit", "pyyaml"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/dlens"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["docs", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src/dlens"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["dlens.graph.*", "dlens.agent.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: runs dbt end to end on a vendored corpus"]
