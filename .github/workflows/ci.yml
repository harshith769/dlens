name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no major tags since v8; pin the full immutable tag.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --extra agent
      - run: make lint
      - run: make test
      # Exact sync removes the extras: the base package must work without ollama/google-genai.
      - name: core install (no extras)
        run: |
          uv sync
          uv run dlens --version
          uv run pytest -q -m "not integration" --ignore=tests/unit/agent
