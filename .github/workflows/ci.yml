name: ci
on:
  push:
    # main, plus session branches (e.g. s06-artifact-ingest) so a pushed branch gets CI
    # without opening a PR.
    branches: [main, "s[0-9][0-9]-*"]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no major tags since v8; pin the full immutable tag.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      # One retry: a transient download error (e.g. a release asset 404) passes on the second
      # try; a real resolution error fails twice and still fails the job.
      - run: uv sync --extra agent --extra ui || { sleep 15; uv sync --extra agent --extra ui; }
      - run: make lint
      - run: make test
      # Exact sync removes the extras: the base package must work without ollama/google-genai.
      - name: core install (no extras)
        run: |
          uv sync || { sleep 15; uv sync; }
          uv run dlens --version
          uv run pytest -q -m "not integration" --ignore=tests/unit/agent

  # Retrieval extra (S07, ADR 0021): bm25s + onnxruntime, no torch. The pinned embedding model
  # is cached by revision, so it downloads once; the second `dlens search` runs offline.
  retrieval:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra retrieval || { sleep 15; uv sync --extra retrieval; }
      - name: no torch, nvidia or sentence-transformers in the install
        run: |
          if uv pip list --format freeze | grep -i -E '^(torch|nvidia-|triton|sentence-transformers)'; then
            exit 1
          fi
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-small-en-v1.5-5c38ec7c405ec4b44b94cc5a9bb96e735b38267a
      - name: retrieval tests (fake embedder, then the real model)
        run: >
          uv run pytest -q tests/unit/retrieval tests/unit/agent/tools/test_search_docs.py
          tests/unit/eval/test_s1.py
          tests/integration/test_retrieval_real.py
      - name: dlens search on eph_shop, then again offline (index reused)
        run: |
          cp -r tests/fixtures/artifacts/eph_shop "$RUNNER_TEMP/eph_shop"
          T="$RUNNER_TEMP/eph_shop/target"
          uv run dlens ingest --artifacts "$T"
          uv run dlens search "customer order number" --artifacts "$T"
          HF_HUB_OFFLINE=1 uv run dlens search "customer order number" --artifacts "$T" \
            | tee "$RUNNER_TEMP/search.txt"
          grep -q "index reused" "$RUNNER_TEMP/search.txt"

  # Artifact-only ingest (ADR 0013) on macOS and Windows: core install (no extras), then
  # `dlens ingest --artifacts` on the committed eph_shop fixture. Never runs dbt.
  core-artifacts:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync || { sleep 15; uv sync; }
      - name: dlens ingest --artifacts (default cache dir, then reuse, then trace)
        run: |
          cp -r tests/fixtures/artifacts/eph_shop "$RUNNER_TEMP/eph_shop"
          T="$RUNNER_TEMP/eph_shop/target"
          uv run dlens ingest --artifacts "$T"
          uv run dlens ingest --artifacts "$T" | tee "$RUNNER_TEMP/again.txt"
          grep -q "cache reused" "$RUNNER_TEMP/again.txt"
          uv run dlens trace customer_orders.amount_usd --artifacts "$T"
      - name: dlens ingest --artifacts --out, catalog-less
        run: |
          rm "$RUNNER_TEMP/eph_shop/target/catalog.json"
          uv run dlens ingest --artifacts "$RUNNER_TEMP/eph_shop/target" --out "$RUNNER_TEMP/graphs"
          test -f "$RUNNER_TEMP/graphs/graph.json"
      - name: artifact-ingest unit tests
        run: >
          uv run pytest -q tests/unit/test_artifact_target.py tests/unit/test_artifact_cache.py
          tests/unit/test_cli_artifacts.py tests/unit/test_ephemeral_artifacts.py
          tests/unit/test_catalog_less.py tests/unit/test_dialects.py

  # The Streamlit Cloud install: ONLY demo/requirements.txt (no dbt, no torch). Boots the demo
  # entrypoint and replays a preset, so a stray heavy import fails here, not on the live app.
  demo-install:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
      - name: demo/requirements.txt matches uv.lock
        run: |
          make demo-requirements
          git diff --exit-code demo/requirements.txt
      - name: clean venv from demo/requirements.txt only
        run: |
          uv venv --python 3.12 /tmp/demo
          uv pip install --python /tmp/demo/bin/python -r demo/requirements.txt
      - name: boot the demo and click a preset
        run: /tmp/demo/bin/python scripts/demo_install_check.py
