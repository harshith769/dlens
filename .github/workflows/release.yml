name: release
on:
  push:
    tags: ["v*"]

# Trusted Publishing only: no API tokens anywhere. Jobs that publish get id-token: write.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
      - name: Tag must match the package version
        run: |
          version=$(uv run --no-project python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - run: uv build
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  testpypi:
    needs: build
    runs-on: ubuntu-24.04
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  smoke-testpypi:
    needs: testpypi
    runs-on: ubuntu-24.04
    steps:
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
      - name: Install from TestPyPI in a fresh venv and run dlens --version
        run: |
          version="${GITHUB_REF_NAME#v}"
          uv venv --python 3.12 /tmp/smoke
          # Dependencies are not on TestPyPI, so fall back to PyPI for them.
          # The index can lag a few seconds behind the upload: retry.
          for i in 1 2 3 4 5 6; do
            uv pip install --python /tmp/smoke/bin/python \
              --index-url https://test.pypi.org/simple/ \
              --extra-index-url https://pypi.org/simple/ \
              --index-strategy unsafe-best-match \
              "dlens-lineage==$version" && break
            echo "not available yet, retry $i"; sleep 20
          done
          out=$(/tmp/smoke/bin/dlens --version)
          echo "dlens --version: $out"
          test "$out" = "$version"

  pypi:
    needs: smoke-testpypi
    runs-on: ubuntu-24.04
    # Configure a required reviewer on this environment so the real publish waits for approval.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.2
