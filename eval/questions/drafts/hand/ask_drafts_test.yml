# Ask (meaning) drafts for the TEST split (S15a, s15a-drafts-design.md §1). DRAFTED by Claude Code
# from the corpus SQL / YAML; the owner reviews each one in the batch sheets. Gold = a rubric of
# required facts, each citing file:line. Every target is a test-pool column (pools.yml), and every
# model.column id in a question is a test-pool column. Stale-doc facts follow the SQL.
#
# Fields as eval/questions/review/ask_drafts.yml: key, target, wording, question (template text for
# paraphrase rows), traps, facts [{fact, source}].

asks:
  # -- revenue definitions (6) -------------------------------------------------------------------
  - key: t_attributed_revenue_refunds
    target: int_order_attribution.attributed_revenue
    wording: identifier
    question: "Does int_order_attribution.attributed_revenue subtract refunds?"
    traps: [two_revenue_definitions]
    facts:
      - {fact: "No: attributed_revenue = items_subtotal + sales_tax; refunds are not deducted.", source: "corpora/synthetic_shop/models/intermediate/int_order_attribution.sql:8"}
      - {fact: "It includes sales tax (the marketing revenue definition, not finance revenue).", source: "corpora/synthetic_shop/models/intermediate/int_order_attribution.sql:8"}
      - {fact: "Finance revenue is items_subtotal - refund_amount instead.", source: "corpora/synthetic_shop/models/marts/fct_orders.sql:13"}

  - key: t_profit_net_revenue_vs_finance
    target: int_order_profit.net_revenue
    wording: identifier
    question: "Is int_order_profit.net_revenue the same thing as finance revenue?"
    traps: [two_revenue_definitions]
    facts:
      - {fact: "No: net_revenue = items_subtotal - refund_amount - coalesce(discount_total, 0).", source: "corpora/synthetic_shop/models/intermediate/int_order_profit.sql:14"}
      - {fact: "Finance revenue is items_subtotal - refund_amount, so net_revenue is finance revenue minus promotion discounts.", source: "corpora/synthetic_shop/models/marts/fct_orders.sql:13"}
      - {fact: "Neither includes sales tax.", source: "corpora/synthetic_shop/models/intermediate/int_order_profit.sql:14"}

  - key: t_segment_revenue_definition
    target: fct_segment_monthly.segment_revenue_finance
    wording: name_words
    question: "Which revenue definition is summed into segment revenue finance in segment monthly?"
    traps: [two_revenue_definitions, deep_chain]
    facts:
      - {fact: "It is sum(orders.revenue_finance) from fct_orders.", source: "corpora/synthetic_shop/models/marts/fct_segment_monthly.sql:6"}
      - {fact: "revenue_finance = items_subtotal - refund_amount (excludes tax, deducts refunds).", source: "corpora/synthetic_shop/models/marts/fct_orders.sql:13"}
      - {fact: "Grouped by customer segment and order month.", source: "corpora/synthetic_shop/models/marts/fct_segment_monthly.sql:10"}

  - key: t_orders_revenue_marketing_parts
    target: fct_orders.revenue_marketing
    wording: identifier
    question: "Does fct_orders.revenue_marketing include sales tax, and does it deduct refunds?"
    traps: [two_revenue_definitions]
    facts:
      - {fact: "revenue_marketing = items_subtotal + sales_tax.", source: "corpora/synthetic_shop/models/marts/fct_orders.sql:14"}
      - {fact: "It includes sales tax.", source: "corpora/synthetic_shop/models/marts/fct_orders.sql:14"}
      - {fact: "It does not deduct refunds (refunded_amount is not part of the formula).", source: "corpora/synthetic_shop/models/marts/fct_orders.sql:14"}

  - key: t_monthly_net_vs_finance
    target: fct_monthly_finance.net_revenue
    wording: paraphrase
    question: "How does fct_monthly_finance.net_revenue differ from fct_monthly_finance.revenue_finance?"
    traps: [two_revenue_definitions, deep_chain]
    facts:
      - {fact: "net_revenue is the monthly sum of fct_order_margins.net_revenue.", source: "corpora/synthetic_shop/models/marts/fct_monthly_finance.sql:25"}
      - {fact: "That order-level net_revenue also subtracts promotion discounts (items_subtotal - refund_amount - discount_total).", source: "corpora/synthetic_shop/models/intermediate/int_order_profit.sql:14"}
      - {fact: "revenue_finance is the monthly sum of daily revenue_finance, i.e. items_subtotal - refund_amount with no discount deduction.", source: "corpora/synthetic_shop/models/marts/fct_monthly_finance.sql:13"}
      - {fact: "The two monthly subqueries are joined on the month.", source: "corpora/synthetic_shop/models/marts/fct_monthly_finance.sql:30"}

  - key: t_roas_attribution_description
    target: fct_marketing_attribution.roas
    wording: description
    question: "Which revenue definition is used in the column documented as 'Attributed marketing revenue divided by spend'?"
    traps: [two_revenue_definitions]
    facts:
      - {fact: "roas = coalesce(attributed_revenue, 0) / nullif(spend_usd, 0) per day and channel.", source: "corpora/synthetic_shop/models/marts/fct_marketing_attribution.sql:19"}
      - {fact: "attributed_revenue is summed from int_order_attribution by order date and attributed channel.", source: "corpora/synthetic_shop/models/marts/fct_marketing_attribution.sql:6"}
      - {fact: "attributed_revenue = items_subtotal + sales_tax: the marketing definition, not finance revenue.", source: "corpora/synthetic_shop/models/intermediate/int_order_attribution.sql:8"}

  # -- stale doc (2): facts follow the SQL ---------------------------------------------------------
  - key: t_margins_contribution_subtracts
    target: fct_order_margins.contribution_margin
    wording: identifier
    question: "What does fct_order_margins.contribution_margin subtract from gross margin?"
    traps: [stale_doc, select_star, fan_in_aggregate]
    facts:
      - {fact: "It passes through from int_order_profit via SELECT * EXCLUDE (is_profitable).", source: "corpora/synthetic_shop/models/marts/fct_order_margins.sql:2"}
      - {fact: "It subtracts shipping_cost_total.", source: "corpora/synthetic_shop/models/intermediate/int_order_profit.sql:20"}
      - {fact: "It also subtracts discount_total (promotion discounts).", source: "corpora/synthetic_shop/models/intermediate/int_order_profit.sql:21"}
      - {fact: "The YAML description mentions only shipping cost, so the doc is stale; the SQL is right.", source: "corpora/synthetic_shop/models/marts/schema.yml:55"}

  - key: t_margins_contribution_doc_check
    target: fct_order_margins.contribution_margin
    wording: description
    question: "Is the column documented as 'Gross margin minus shipping cost' in order margins really computed that way?"
    traps: [stale_doc, select_star]
    facts:
      - {fact: "No: the SQL computes gross_margin - shipping_cost_total - discount_total.", source: "corpora/synthetic_shop/models/intermediate/int_order_profit.sql:19"}
      - {fact: "The discount term is coalesce(promotions.discount_total, 0).", source: "corpora/synthetic_shop/models/intermediate/int_order_profit.sql:21"}
      - {fact: "fct_order_margins takes the column unchanged from int_order_profit.", source: "corpora/synthetic_shop/models/marts/fct_order_margins.sql:2"}

  # -- near-duplicate grain (5) --------------------------------------------------------------------
  - key: t_refund_amt_vs_history_amount
    target: stg_refunds.refund_amt
    wording: identifier
    question: "What is the grain of stg_refunds.refund_amt compared with int_customer_order_history.refund_amount?"
    traps: [near_duplicate_names]
    facts:
      - {fact: "stg_refunds.refund_amt is one value per refund row (keyed by refund_id).", source: "corpora/synthetic_shop/models/staging/stg_refunds.sql:4"}
      - {fact: "refund_amount = sum(refund_amt) per order.", source: "corpora/synthetic_shop/models/intermediate/int_order_financials.sql:4"}
      - {fact: "The sum is grouped by order_id.", source: "corpora/synthetic_shop/models/intermediate/int_order_financials.sql:6"}
      - {fact: "int_customer_order_history passes it through with SELECT *.", source: "corpora/synthetic_shop/models/intermediate/int_customer_order_history.sql:2"}

  - key: t_daily_refunded_grain
    target: fct_daily_revenue.refunded_amount
    wording: name_words
    question: "Is refunded amount in daily revenue a per-order or a per-day figure?"
    traps: [near_duplicate_names]
    facts:
      - {fact: "Per day: sum(refunded_amount) over the day's orders.", source: "corpora/synthetic_shop/models/marts/fct_daily_revenue.sql:6"}
      - {fact: "Grouped by order_date.", source: "corpora/synthetic_shop/models/marts/fct_daily_revenue.sql:8"}
      - {fact: "In fct_orders, refunded_amount is the per-order refund_amount renamed.", source: "corpora/synthetic_shop/models/marts/fct_orders.sql:11"}

  - key: t_shipping_costs_usd_grain
    target: fct_shipping_performance.shipping_costs_usd
    wording: paraphrase
    question: "At what grain is fct_shipping_performance.shipping_costs_usd reported?"
    traps: [near_duplicate_names]
    facts:
      - {fact: "It is sum(shipping_cost_usd) over shipments.", source: "corpora/synthetic_shop/models/marts/fct_shipping_performance.sql:7"}
      - {fact: "Grouped by carrier and the month of shipped_at.", source: "corpora/synthetic_shop/models/marts/fct_shipping_performance.sql:10"}
      - {fact: "Only shipments with a shipped_at are counted.", source: "corpora/synthetic_shop/models/marts/fct_shipping_performance.sql:9"}

  - key: t_shipment_cost_vs_order_total
    target: int_shipments_enriched.shipping_cost_usd
    wording: name_words
    question: "How is shipping cost usd in shipments enriched different from shipping cost total in order profit?"
    traps: [near_duplicate_names]
    facts:
      - {fact: "shipping_cost_usd in int_shipments_enriched is one value per shipment, passed from stg_shipments.", source: "corpora/synthetic_shop/models/intermediate/int_shipments_enriched.sql:8"}
      - {fact: "shipping_cost_total = sum(shipping_cost_usd) per order in int_order_shipping.", source: "corpora/synthetic_shop/models/intermediate/int_order_shipping.sql:4"}
      - {fact: "int_order_profit takes it with coalesce(..., 0), so orders without shipments get 0.", source: "corpora/synthetic_shop/models/intermediate/int_order_profit.sql:17"}

  - key: t_margins_shipping_total_grain
    target: fct_order_margins.shipping_cost_total
    wording: identifier
    question: "Is fct_order_margins.shipping_cost_total a per-shipment or a per-order amount?"
    traps: [near_duplicate_names, select_star]
    facts:
      - {fact: "Per order: it passes through SELECT * EXCLUDE from int_order_profit.", source: "corpora/synthetic_shop/models/marts/fct_order_margins.sql:2"}
      - {fact: "int_order_profit.shipping_cost_total = coalesce(shipping.shipping_cost_total, 0).", source: "corpora/synthetic_shop/models/intermediate/int_order_profit.sql:17"}
      - {fact: "The underlying value sums shipment costs grouped by order_id.", source: "corpora/synthetic_shop/models/intermediate/int_order_shipping.sql:9"}

  # -- CASE meaning (6) ------------------------------------------------------------------------------
  - key: t_is_late_delivery_rule
    target: int_shipments_enriched.is_late_delivery
    wording: identifier
    question: "When is int_shipments_enriched.is_late_delivery true?"
    traps: [case_transformation]
    facts:
      - {fact: "True when delivery_days > 5, otherwise false.", source: "corpora/synthetic_shop/models/intermediate/int_shipments_enriched.sql:10"}
      - {fact: "delivery_days = days from shipped_at to delivered_at.", source: "corpora/synthetic_shop/models/staging/stg_shipments.sql:8"}

  - key: t_rfm_recency_values
    target: dim_customer_rfm.rfm_recency_score
    wording: identifier
    question: "What values can dim_customer_rfm.rfm_recency_score take, and what decides each one?"
    traps: [case_transformation]
    facts:
      - {fact: "3 when recency_days <= 30.", source: "corpora/synthetic_shop/models/marts/dim_customer_rfm.sql:22"}
      - {fact: "2 when recency_days <= 90.", source: "corpora/synthetic_shop/models/marts/dim_customer_rfm.sql:23"}
      - {fact: "1 otherwise.", source: "corpora/synthetic_shop/models/marts/dim_customer_rfm.sql:24"}
      - {fact: "recency_days = days from the customer's most_recent_order_date to the latest order date in fct_orders.", source: "corpora/synthetic_shop/models/marts/dim_customer_rfm.sql:8"}

  - key: t_rfm_score_digits
    target: dim_customer_rfm.rfm_score
    wording: name_words
    question: "How is the rfm score built from its three component scores?"
    traps: [fan_in_aggregate, case_transformation]
    facts:
      - {fact: "rfm_score = rfm_recency_score * 100 + rfm_frequency_score * 10 + rfm_monetary_score.", source: "corpora/synthetic_shop/models/marts/dim_customer_rfm.sql:46"}
      - {fact: "Frequency score: 3 when order_count >= 4, 2 when >= 2, else 1.", source: "corpora/synthetic_shop/models/marts/dim_customer_rfm.sql:27"}
      - {fact: "Monetary score: 3 when lifetime_value >= 500, 2 when >= 150, else 1.", source: "corpora/synthetic_shop/models/marts/dim_customer_rfm.sql:32"}

  - key: t_is_high_value_rule
    target: dim_customer_segments.is_high_value
    wording: identifier
    question: "What makes dim_customer_segments.is_high_value true?"
    traps: [case_transformation]
    facts:
      - {fact: "It is rfm_monetary_score = 3.", source: "corpora/synthetic_shop/models/marts/dim_customer_segments.sql:11"}
      - {fact: "A monetary score of 3 means lifetime_value >= 500.", source: "corpora/synthetic_shop/models/marts/dim_customer_rfm.sql:32"}

  - key: t_status_group_open
    target: int_order_financials.order_status_group
    wording: identifier
    question: "Which raw order statuses end up as 'open' in int_order_financials.order_status_group?"
    traps: [case_transformation]
    facts:
      - {fact: "int_order_financials takes order_status_group unchanged from int_orders_enriched.", source: "corpora/synthetic_shop/models/intermediate/int_order_financials.sql:21"}
      - {fact: "'placed' maps to 'open'.", source: "corpora/synthetic_shop/models/intermediate/int_orders_enriched.sql:16"}
      - {fact: "'shipped' maps to 'open'.", source: "corpora/synthetic_shop/models/intermediate/int_orders_enriched.sql:17"}

  - key: t_is_discounted_rule
    target: int_order_item_margins.is_discounted
    wording: paraphrase
    question: "When is int_order_item_margins.is_discounted true?"
    traps: [case_transformation]
    facts:
      - {fact: "int_order_item_margins takes is_discounted from int_order_items_enriched.", source: "corpora/synthetic_shop/models/intermediate/int_order_item_margins.sql:7"}
      - {fact: "True when the line's unit_price is below the product's list_price, otherwise false.", source: "corpora/synthetic_shop/models/intermediate/int_order_items_enriched.sql:9"}

  # -- star exclusion (3) ----------------------------------------------------------------------------
  - key: t_is_profitable_in_margins
    target: int_order_profit.is_profitable
    wording: identifier
    question: "Can int_order_profit.is_profitable be read from the order margins mart?"
    traps: [select_star]
    facts:
      - {fact: "No: fct_order_margins selects * exclude (is_profitable) from int_order_profit.", source: "corpora/synthetic_shop/models/marts/fct_order_margins.sql:2"}
      - {fact: "is_profitable is true when gross margin minus shipping minus discounts is > 0.", source: "corpora/synthetic_shop/models/intermediate/int_order_profit.sql:25"}

  - key: t_margin_pct_zero_revenue
    target: fct_order_margins.margin_pct
    wording: identifier
    question: "How is fct_order_margins.margin_pct computed, and what happens when net revenue is zero?"
    traps: [select_star]
    facts:
      - {fact: "margin_pct = contribution_margin / nullif(net_revenue, 0).", source: "corpora/synthetic_shop/models/marts/fct_order_margins.sql:3"}
      - {fact: "When net_revenue is 0 the result is null (no division by zero).", source: "corpora/synthetic_shop/models/marts/fct_order_margins.sql:3"}
      - {fact: "Its inputs come through SELECT * EXCLUDE (is_profitable) from int_order_profit.", source: "corpora/synthetic_shop/models/marts/fct_order_margins.sql:2"}

  - key: t_payment_event_negative
    target: fct_payment_events.event_amount_usd
    wording: paraphrase
    question: "Why are some fct_payment_events.event_amount_usd values negative?"
    traps: [select_star, union_all]
    facts:
      - {fact: "fct_payment_events is select * from int_payment_events.", source: "corpora/synthetic_shop/models/marts/fct_payment_events.sql:1"}
      - {fact: "The refund branch writes -1 * refund_amt.", source: "corpora/synthetic_shop/models/intermediate/int_payment_events.sql:13"}
      - {fact: "The payment branch writes amount_usd (positive); the branches are combined with UNION ALL.", source: "corpora/synthetic_shop/models/intermediate/int_payment_events.sql:8"}

  # -- filter semantics (3) --------------------------------------------------------------------------
  - key: t_daily_sessions_bots
    target: int_sessions_daily.session_count
    wording: description
    question: "Are bot sessions counted in the column documented as 'Sessions on the day in the channel'?"
    traps: []
    facts:
      - {fact: "No: session_count counts sessions from int_web_sessions_clean.", source: "corpora/synthetic_shop/models/intermediate/int_sessions_daily.sql:7"}
      - {fact: "int_web_sessions_clean drops sessions flagged is_bot.", source: "corpora/synthetic_shop/models/intermediate/int_web_sessions_clean.sql:14"}
      - {fact: "It also drops sessions with zero page views.", source: "corpora/synthetic_shop/models/intermediate/int_web_sessions_clean.sql:15"}
      - {fact: "Counted per session_date and channel.", source: "corpora/synthetic_shop/models/intermediate/int_sessions_daily.sql:8"}

  - key: t_product_gross_margin_orders
    target: fct_product_performance.gross_margin
    wording: description
    question: "Which orders feed the column documented as 'Sum of line margins on completed orders', and how is a line margin computed?"
    traps: []
    facts:
      - {fact: "Only orders whose order_status_group is 'complete'.", source: "corpora/synthetic_shop/models/marts/fct_product_performance.sql:14"}
      - {fact: "'complete' is the raw status 'completed'.", source: "corpora/synthetic_shop/models/intermediate/int_orders_enriched.sql:15"}
      - {fact: "line_margin = line_amount - quantity * unit_cost.", source: "corpora/synthetic_shop/models/intermediate/int_order_item_margins.sql:11"}
      - {fact: "Summed per product.", source: "corpora/synthetic_shop/models/marts/fct_product_performance.sql:8"}

  - key: t_inventory_test_warehouse
    target: int_inventory_daily.qty_on_hand
    wording: identifier
    question: "Does int_inventory_daily.qty_on_hand include snapshots from every warehouse?"
    traps: []
    facts:
      - {fact: "No: rows with warehouse_code 'WH_TEST' are filtered out.", source: "corpora/synthetic_shop/models/intermediate/int_inventory_daily.sql:18"}
      - {fact: "Only snapshots of products found in stg_products are kept (inner join).", source: "corpora/synthetic_shop/models/intermediate/int_inventory_daily.sql:16"}

  # -- rename / fan-in / join-key meaning (3) --------------------------------------------------------
  - key: t_tax_rename_names
    target: raw_orders.tax_usd
    wording: identifier
    question: "Under which names does raw_orders.tax_usd appear in the later models?"
    traps: [rename_chain]
    facts:
      - {fact: "stg_orders renames it to tax_amount.", source: "corpora/synthetic_shop/models/staging/stg_orders.sql:6"}
      - {fact: "int_orders_enriched renames it to order_tax.", source: "corpora/synthetic_shop/models/intermediate/int_orders_enriched.sql:22"}
      - {fact: "int_order_financials renames it to sales_tax.", source: "corpora/synthetic_shop/models/intermediate/int_order_financials.sql:24"}

  - key: t_contribution_domains
    target: int_order_profit.contribution_margin
    wording: paraphrase
    question: "Which three areas of the business feed int_order_profit.contribution_margin?"
    traps: [fan_in_aggregate]
    facts:
      - {fact: "Item margins: gross_margin = sum(line_margin) from int_order_item_margins.", source: "corpora/synthetic_shop/models/intermediate/int_order_profit.sql:5"}
      - {fact: "Shipping: shipping_cost_total from int_order_shipping is subtracted.", source: "corpora/synthetic_shop/models/intermediate/int_order_profit.sql:20"}
      - {fact: "Promotions: discount_total from int_order_promotions is subtracted.", source: "corpora/synthetic_shop/models/intermediate/int_order_profit.sql:21"}

  - key: t_supplier_id_join_key
    target: stg_suppliers.supplier_id
    wording: paraphrase
    question: "How does stg_suppliers.supplier_id affect int_product_costs_current if no output column is copied from it?"
    traps: [join_key_only]
    facts:
      - {fact: "It is the join key: costs.supplier_id = suppliers.supplier_id.", source: "corpora/synthetic_shop/models/intermediate/int_product_costs_current.sql:11"}
      - {fact: "supplier_name, supplier_country and lead_time_days come from stg_suppliers through that join.", source: "corpora/synthetic_shop/models/intermediate/int_product_costs_current.sql:6"}
      - {fact: "The output supplier_id is copied from stg_product_costs, not from stg_suppliers.", source: "corpora/synthetic_shop/models/intermediate/int_product_costs_current.sql:3"}
