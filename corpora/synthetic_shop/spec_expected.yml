# Expected numbers for lineage_spec.yml (v2), every one taken from corpora/synthetic_shop/DESIGN_v2.md.
# Used by scripts/check_gold_spec.py --expected and by tests/unit/test_check_gold_spec.py.
# Paths below are relative to this file. Never fill these in from dlens output.

# The v1-identity check (`v1_spec:`) ran until the S02b swap. v1 SQL is now guarded by
# v1_frozen.sha256; pass --v1-spec <file> to rerun it against a saved v1 spec.
traps: traps.yml  # every reference must exist (DESIGN_v2 §3)

# DESIGN_v2 Appendix A: the 15 frozen v1 models (splits the indirect-edge report v1 vs new)
v1_models: [stg_customers, stg_orders, stg_order_items, stg_products, stg_payments, stg_refunds,
            int_order_items_enriched, int_orders_enriched, int_payment_events, int_order_financials,
            int_customer_order_history, fct_orders, dim_customers, fct_daily_revenue,
            fct_payment_events]

# DESIGN_v2 §0 Summary and §2 Model inventory
counts:
  seeds: 14
  seed_columns: 73
  models: {stg: 14, int: 18, mart: 17}            # 49
  model_columns: {stg: 74, int: 130, mart: 114}    # 318
  direct_edges: 363
  direct_kinds: {IDENTITY: 160, RENAME: 42, TRANSFORMATION: 88, AGGREGATION: 73}

# DESIGN_v2 §5 histogram (v2 row) and §10 D3; depth = longest direct-edge path from a seed
depth_histogram: {1: 74, 2: 69, 3: 64, 4: 28, 5: 27, 6: 28, 7: 12, 8: 10, 9: 3, 10: 2, n/a: 1}
depth_na: [int_web_sessions_clean.session_number]
max_depth: 10  # §5 "Margin": fct_segment_monthly / fct_customer_leaderboard .customer_segment

# DESIGN_v2 §5 "6+ columns by model" (total 55)
six_plus_by_model:
  fct_orders: 5
  dim_customers: 4
  fct_daily_revenue: 4
  fct_monthly_finance: 7
  fct_customer_cohorts: 6
  dim_customer_rfm: 5
  fct_order_margins: 5
  fct_segment_monthly: 5
  dim_customer_segments: 4
  fct_marketing_attribution: 4
  fct_channel_performance_monthly: 2
  fct_customer_leaderboard: 2
  int_order_attribution: 1
  int_order_profit: 1

# DESIGN_v2 §1 constraints and §3 trap 2: columns that must not exist
absent_columns:
  - {column: stg_orders.ship_date, why: "dev-19 expects a refusal (§1)"}
  - {column: int_order_item_margins.product_category, why: "dev-14: no second product_category on order items (§1)"}
  - {column: fct_order_margins.is_profitable, why: "SELECT * EXCLUDE (is_profitable) (§3 trap 2)"}

# DESIGN_v2 §1, §3 and §9 (dev-10): checked direct-only and direct + indirect (D7 targets)
unreachable:
  - {from: raw_payments.amt, to: dim_customers.lifetime_value, modes: [direct, direct+indirect], why: "dev-10 answer is no"}
  # §3 trap 3 yes/no example "refund_amount -> roas: no" (read as the per-order refund_amount)
  - {from: int_order_financials.refund_amount, to: fct_marketing_attribution.roas, modes: [direct, direct+indirect], why: "§3 trap 3: ROAS uses marketing revenue"}
  - {from: int_order_financials.refund_amount, to: fct_channel_performance_monthly.roas, modes: [direct, direct+indirect], why: "§3 trap 3: ROAS uses marketing revenue"}

