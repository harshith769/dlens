# Gold lineage spec v2 for corpora/synthetic_shop (v0.3: 49 models).
#
# Hand-authored from DESIGN_v2.md (Appendix A for the frozen v1 names, §2 for seeds and
# "Upstream", Appendix C for every new column). NEVER regenerate this file from dlens (or any
# parser) output. S02b swaps it in as lineage_spec.yml once the v2 SQL exists.
#
# seeds / models: the column inventory, written from the design tables independently of the edges.
#   models.<name>.depends_on is DESIGN_v2 §2 "Upstream" (seeds for staging).
# edges: direct edges (phase v0.1). The first block is the 115 v1 edges, copied unchanged from
#   lineage_spec.yml. Edge kind = the strongest operation on the path inside one model:
#   AGGREGATION > TRANSFORMATION > RENAME > IDENTITY. `traps` tags are informational;
#   traps_v2.yml is the source of truth.
# indirect_edges: phase v0.3, one row per key column and clause (DESIGN_v2 §4, §10 D1 and D7).
#   Expanded to pairs by dlens.gold_spec.expand_indirect. See docs/explain/gold-spec.md.
# Check: uv run python scripts/check_gold_spec.py --spec corpora/synthetic_shop/lineage_spec_v2.yml \
#          --expected corpora/synthetic_shop/spec_v2_expected.yml

seeds:
  raw_customers:           [id, first_name, last_name, email, country, created_at]
  raw_orders:              [id, user_id, order_date, status, tax_usd]
  raw_order_items:         [id, order_id, product_id, quantity, unit_price]
  raw_products:            [id, name, category, list_price]
  raw_payments:            [id, order_id, method, amt, created_at]
  raw_refunds:             [id, order_id, refund_amt, reason, created_at]
  raw_shipments:           [id, order_id, carrier, shipped_at, delivered_at, shipping_cost_usd]
  raw_web_sessions:        [id, user_id, started_at, channel, utm_campaign, page_views, is_bot]
  raw_marketing_spend:     [spend_day, channel, campaign, spend_usd, impressions, clicks]
  raw_promotions:          [id, code, discount_pct, starts_at, ends_at, channel]
  raw_order_promotions:    [id, order_id, promotion_id, discount_usd]
  raw_suppliers:           [id, name, country, lead_time_days]
  raw_product_costs:       [id, product_id, supplier_id, unit_cost, valid_from]
  raw_inventory_snapshots: [id, product_id, snapshot_date, qty_on_hand, warehouse]

models:
  # ---------------------------------------------------------------- staging
  stg_customers:  # v1, frozen
    depends_on: [raw_customers]
    columns: [customer_id, first_name, last_name, email, country_code, signup_at]
  stg_orders:  # v1, frozen
    depends_on: [raw_orders]
    columns: [order_id, customer_id, order_date, status, tax_amount]
  stg_order_items:  # v1, frozen
    depends_on: [raw_order_items]
    columns: [order_item_id, order_id, product_id, quantity, unit_price]
  stg_products:  # v1, frozen
    depends_on: [raw_products]
    columns: [product_id, product_name, category, list_price]
  stg_payments:  # v1, frozen
    depends_on: [raw_payments]
    columns: [payment_id, order_id, payment_method, amount_usd, paid_at]
  stg_refunds:  # v1, frozen
    depends_on: [raw_refunds]
    columns: [refund_id, order_id, refund_amt, refund_reason, refunded_at]
  stg_shipments:
    depends_on: [raw_shipments]
    columns: [shipment_id, order_id, carrier, shipped_at, delivered_at, shipping_cost_usd, delivery_days]
  stg_web_sessions:
    depends_on: [raw_web_sessions]
    columns: [session_id, customer_id, session_started_at, channel, utm_campaign, page_views, is_bot]
  stg_marketing_spend:
    depends_on: [raw_marketing_spend]
    columns: [spend_date, channel, campaign_name, spend_usd, impressions, clicks]
  stg_promotions:
    depends_on: [raw_promotions]
    columns: [promotion_id, promo_code, discount_pct, starts_at, ends_at, promo_channel]
  stg_order_promotions:
    depends_on: [raw_order_promotions]
    columns: [order_promotion_id, order_id, promotion_id, discount_usd]
  stg_suppliers:
    depends_on: [raw_suppliers]
    columns: [supplier_id, supplier_name, supplier_country, lead_time_days]
  stg_product_costs:
    depends_on: [raw_product_costs]
    columns: [product_cost_id, product_id, supplier_id, unit_cost, valid_from]
  stg_inventory_snapshots:
    depends_on: [raw_inventory_snapshots]
    columns: [snapshot_id, product_id, snapshot_date, qty_on_hand, warehouse_code]
  # ----------------------------------------------------------- intermediate
  int_order_items_enriched:  # v1, frozen
    depends_on: [stg_order_items, stg_products]
    columns: [order_item_id, order_id, product_id, product_category, quantity, unit_price, line_amount, is_discounted]
  int_orders_enriched:  # v1, frozen
    depends_on: [stg_orders, int_order_items_enriched]
    columns: [order_id, customer_id, order_date, order_status_group, order_tax, item_count, items_subtotal]
  int_payment_events:  # v1, frozen
    depends_on: [stg_payments, stg_refunds]
    columns: [event_id, order_id, event_amount_usd, event_at]
  int_order_financials:  # v1, frozen
    depends_on: [int_orders_enriched, stg_refunds, int_payment_events]
    columns: [order_id, customer_id, order_date, order_status_group, item_count, items_subtotal, sales_tax, order_total, refund_amount, net_paid_usd]
  int_customer_order_history:  # v1, frozen
    depends_on: [int_order_financials]
    columns: [order_id, customer_id, order_date, order_status_group, item_count, items_subtotal, sales_tax, order_total, refund_amount, net_paid_usd, previous_order_date]
  int_shipments_enriched:
    depends_on: [stg_shipments, stg_orders]
    columns: [shipment_id, order_id, carrier, shipped_at, delivered_at, delivery_days, shipping_cost_usd, days_to_ship, is_late_delivery]
  int_order_shipping:
    depends_on: [int_shipments_enriched]
    columns: [order_id, shipment_count, shipping_cost_total, first_shipped_at, last_delivered_at, late_shipment_count]
  int_web_sessions_clean:
    depends_on: [stg_web_sessions]
    columns: [session_id, customer_id, session_started_at, channel, utm_campaign, page_views, session_date, session_number]
  int_campaign_spend_daily:
    depends_on: [stg_marketing_spend]
    columns: [spend_date, channel, spend_usd, impressions, clicks, click_through_rate]
  int_sessions_daily:
    depends_on: [int_web_sessions_clean]
    columns: [session_date, channel, session_count, visitor_count, page_views]
  int_customer_sessions:
    depends_on: [int_web_sessions_clean]
    columns: [customer_id, session_count, paid_session_count, first_session_at, last_session_at, total_page_views]
  int_order_attribution:
    depends_on: [int_customer_order_history, int_web_sessions_clean]
    columns: [order_id, customer_id, order_date, attributed_session_id, attributed_channel, attributed_campaign, attributed_revenue, days_to_convert]
  int_product_costs_current:
    depends_on: [stg_product_costs, stg_suppliers]
    columns: [product_id, supplier_id, unit_cost, cost_valid_from, supplier_name, supplier_country, lead_time_days]
  int_order_item_margins:
    depends_on: [int_order_items_enriched, int_product_costs_current]
    columns: [order_item_id, order_id, product_id, quantity, line_amount, is_discounted, unit_cost, supplier_id, line_cost, line_margin]
  int_order_promotions:
    depends_on: [stg_order_promotions, stg_promotions]
    columns: [order_id, promotion_count, discount_total, max_discount_pct, promo_codes]
  int_inventory_daily:
    depends_on: [stg_inventory_snapshots, stg_products]
    columns: [product_id, snapshot_date, warehouse_code, qty_on_hand, inventory_value, prior_qty_on_hand, qty_change]
  int_order_adjustments:
    depends_on: [stg_order_promotions, stg_refunds, stg_shipments]
    columns: [adjustment_id, order_id, adjustment_amount_usd]
  int_order_profit:
    depends_on: [int_customer_order_history, int_order_item_margins, int_order_shipping, int_order_promotions]
    columns: [order_id, customer_id, order_date, net_revenue, cogs_total, gross_margin, shipping_cost_total, discount_total, contribution_margin, is_profitable]
  # ------------------------------------------------------------------ marts
  fct_orders:  # v1, frozen
    depends_on: [int_customer_order_history]
    columns: [order_id, customer_id, order_date, previous_order_date, order_status_group, item_count, items_subtotal, sales_tax, order_total, refunded_amount, net_paid_usd, revenue_finance, revenue_marketing, days_since_previous_order]
  dim_customers:  # v1, frozen
    depends_on: [stg_customers, fct_orders]
    columns: [customer_id, full_name, email, country_code, signup_at, first_order_date, most_recent_order_date, order_count, lifetime_value]
  fct_daily_revenue:  # v1, frozen
    depends_on: [fct_orders]
    columns: [order_date, order_count, revenue_finance, revenue_marketing, refunded_amount]
  fct_payment_events:  # v1, frozen
    depends_on: [int_payment_events]
    columns: [event_id, order_id, event_amount_usd, event_at]
  fct_order_margins:
    depends_on: [int_order_profit]
    columns: [order_id, customer_id, order_date, net_revenue, cogs_total, gross_margin, shipping_cost_total, discount_total, contribution_margin, margin_pct]
  dim_customer_rfm:
    depends_on: [dim_customers, fct_orders, int_customer_sessions]
    columns: [customer_id, recency_days, rfm_recency_score, rfm_frequency_score, rfm_monetary_score, rfm_score, web_session_count]
  dim_customer_segments:
    depends_on: [dim_customer_rfm]
    columns: [customer_id, rfm_score, recency_days, customer_segment, is_high_value]
  fct_segment_monthly:
    depends_on: [fct_orders, dim_customer_segments]
    columns: [order_month, customer_segment, segment_order_count, active_customers, segment_revenue_finance]
  fct_marketing_attribution:
    depends_on: [int_campaign_spend_daily, int_sessions_daily, int_order_attribution]
    columns: [report_date, channel, spend_usd, session_count, attributed_orders, attributed_revenue, cost_per_order, roas]
  fct_channel_performance_monthly:
    depends_on: [fct_marketing_attribution]
    columns: [report_month, channel, spend_usd, attributed_revenue, roas]
  fct_product_performance:
    depends_on: [int_order_item_margins, int_orders_enriched, stg_products]
    columns: [product_id, product_name, product_category, units_sold, discounted_units, gross_sales, gross_margin]
  fct_top_products:
    depends_on: [fct_product_performance]
    columns: [product_id, product_name, units_sold, gross_margin]
  fct_customer_leaderboard:
    depends_on: [dim_customers, dim_customer_segments]
    columns: [customer_id, full_name, lifetime_value_usd, customer_segment]
  fct_inventory_status:
    depends_on: [int_inventory_daily, fct_product_performance]
    columns: [product_id, warehouse_code, as_of_date, qty_on_hand, inventory_value, days_of_cover]
  fct_shipping_performance:
    depends_on: [int_shipments_enriched]
    columns: [carrier, ship_month, shipment_count, late_shipment_count, avg_delivery_days, shipping_costs_usd]
  fct_customer_cohorts:
    depends_on: [fct_orders, dim_customers]
    columns: [cohort_month, order_month, months_since_signup, cohort_customers, repeat_customers, cohort_net_paid, cumulative_net_paid]
  fct_monthly_finance:
    depends_on: [fct_daily_revenue, fct_order_margins, int_order_adjustments, fct_orders]
    columns: [finance_month, revenue_finance, revenue_marketing, refunded_amount, net_revenue, contribution_margin, adjustments_total, revenue_finance_mom_change]

edges:
  # ==================================== v1 edges (115, unchanged from lineage_spec.yml)
  # ---------------------------------------------------------------- staging
  # stg_customers  <- raw_customers
  - {from: raw_customers.id,         to: stg_customers.customer_id,  kind: RENAME,         phase: v0.1, traps: []}
  - {from: raw_customers.first_name, to: stg_customers.first_name,   kind: IDENTITY,       phase: v0.1, traps: []}
  - {from: raw_customers.last_name,  to: stg_customers.last_name,    kind: IDENTITY,       phase: v0.1, traps: []}
  - {from: raw_customers.email,      to: stg_customers.email,        kind: TRANSFORMATION, phase: v0.1, traps: []}
  - {from: raw_customers.country,    to: stg_customers.country_code, kind: TRANSFORMATION, phase: v0.1, traps: []}
  - {from: raw_customers.created_at, to: stg_customers.signup_at,    kind: RENAME,         phase: v0.1, traps: []}

  # stg_orders  <- raw_orders
  - {from: raw_orders.id,         to: stg_orders.order_id,    kind: RENAME,   phase: v0.1, traps: []}
  - {from: raw_orders.user_id,    to: stg_orders.customer_id, kind: RENAME,   phase: v0.1, traps: []}
  - {from: raw_orders.order_date, to: stg_orders.order_date,  kind: IDENTITY, phase: v0.1, traps: []}
  - {from: raw_orders.status,     to: stg_orders.status,      kind: IDENTITY, phase: v0.1, traps: []}
  - {from: raw_orders.tax_usd,    to: stg_orders.tax_amount,  kind: RENAME,   phase: v0.1, traps: [rename_chain]}

  # stg_order_items  <- raw_order_items
  - {from: raw_order_items.id,         to: stg_order_items.order_item_id, kind: RENAME,   phase: v0.1, traps: []}
  - {from: raw_order_items.order_id,   to: stg_order_items.order_id,      kind: IDENTITY, phase: v0.1, traps: []}
  - {from: raw_order_items.product_id, to: stg_order_items.product_id,    kind: IDENTITY, phase: v0.1, traps: []}
  - {from: raw_order_items.quantity,   to: stg_order_items.quantity,      kind: IDENTITY, phase: v0.1, traps: []}
  - {from: raw_order_items.unit_price, to: stg_order_items.unit_price,    kind: IDENTITY, phase: v0.1, traps: [deep_chain]}

  # stg_products  <- raw_products
  - {from: raw_products.id,         to: stg_products.product_id,   kind: RENAME,   phase: v0.1, traps: []}
  - {from: raw_products.name,       to: stg_products.product_name, kind: RENAME,   phase: v0.1, traps: []}
  - {from: raw_products.category,   to: stg_products.category,     kind: IDENTITY, phase: v0.1, traps: []}
  - {from: raw_products.list_price, to: stg_products.list_price,   kind: IDENTITY, phase: v0.1, traps: []}

  # stg_payments  <- raw_payments
  - {from: raw_payments.id,         to: stg_payments.payment_id,     kind: RENAME,   phase: v0.1, traps: []}
  - {from: raw_payments.order_id,   to: stg_payments.order_id,       kind: IDENTITY, phase: v0.1, traps: []}
  - {from: raw_payments.method,     to: stg_payments.payment_method, kind: RENAME,   phase: v0.1, traps: []}
  - {from: raw_payments.amt,        to: stg_payments.amount_usd,     kind: RENAME,   phase: v0.1, traps: []}
  - {from: raw_payments.created_at, to: stg_payments.paid_at,        kind: RENAME,   phase: v0.1, traps: []}

  # stg_refunds  <- raw_refunds
  - {from: raw_refunds.id,         to: stg_refunds.refund_id,     kind: RENAME,   phase: v0.1, traps: []}
  - {from: raw_refunds.order_id,   to: stg_refunds.order_id,      kind: IDENTITY, phase: v0.1, traps: []}
  - {from: raw_refunds.refund_amt, to: stg_refunds.refund_amt,    kind: IDENTITY, phase: v0.1, traps: [near_duplicate_names]}
  - {from: raw_refunds.reason,     to: stg_refunds.refund_reason, kind: RENAME,   phase: v0.1, traps: []}
  - {from: raw_refunds.created_at, to: stg_refunds.refunded_at,   kind: RENAME,   phase: v0.1, traps: []}

  # ----------------------------------------------------------- intermediate
  # int_order_items_enriched  <- stg_order_items JOIN stg_products
  - {from: stg_order_items.order_item_id, to: int_order_items_enriched.order_item_id,    kind: IDENTITY,       phase: v0.1, traps: []}
  - {from: stg_order_items.order_id,      to: int_order_items_enriched.order_id,         kind: IDENTITY,       phase: v0.1, traps: []}
  - {from: stg_order_items.product_id,    to: int_order_items_enriched.product_id,       kind: IDENTITY,       phase: v0.1, traps: []}
  - {from: stg_products.category,         to: int_order_items_enriched.product_category, kind: RENAME,         phase: v0.1, traps: []}
  - {from: stg_order_items.quantity,      to: int_order_items_enriched.quantity,         kind: IDENTITY,       phase: v0.1, traps: []}
  - {from: stg_order_items.unit_price,    to: int_order_items_enriched.unit_price,       kind: IDENTITY,       phase: v0.1, traps: []}
  - {from: stg_order_items.quantity,      to: int_order_items_enriched.line_amount,      kind: TRANSFORMATION, phase: v0.1, traps: []}
  - {from: stg_order_items.unit_price,    to: int_order_items_enriched.line_amount,      kind: TRANSFORMATION, phase: v0.1, traps: [deep_chain]}
  - {from: stg_order_items.unit_price,    to: int_order_items_enriched.is_discounted,    kind: TRANSFORMATION, phase: v0.1, traps: [case_transformation]}
  - {from: stg_products.list_price,       to: int_order_items_enriched.is_discounted,    kind: TRANSFORMATION, phase: v0.1, traps: [case_transformation]}

  # int_orders_enriched  <- stg_orders LEFT JOIN (int_order_items_enriched aggregated per order)
  - {from: stg_orders.order_id,                 to: int_orders_enriched.order_id,           kind: IDENTITY,       phase: v0.1, traps: []}
  - {from: stg_orders.customer_id,              to: int_orders_enriched.customer_id,        kind: IDENTITY,       phase: v0.1, traps: []}
  - {from: stg_orders.order_date,               to: int_orders_enriched.order_date,         kind: IDENTITY,       phase: v0.1, traps: []}
  - {from: stg_orders.status,                   to: int_orders_enriched.order_status_group, kind: TRANSFORMATION, phase: v0.1, traps: [case_transformation]}
  - {from: stg_orders.tax_amount,               to: int_orders_enriched.order_tax,          kind: RENAME,         phase: v0.1, traps: [rename_chain]}
  - {from: int_order_items_enriched.quantity,   to: int_orders_enriched.item_count,         kind: AGGREGATION,    phase: v0.1, traps: []}
  - {from: int_order_items_enriched.line_amount, to: int_orders_enriched.items_subtotal,    kind: AGGREGATION,    phase: v0.1, traps: [deep_chain]}

  # int_payment_events  <- stg_payments UNION ALL stg_refunds (payments branch first)
  - {from: stg_payments.payment_id,  to: int_payment_events.event_id,         kind: TRANSFORMATION, phase: v0.1, traps: [union_all]}
  - {from: stg_refunds.refund_id,    to: int_payment_events.event_id,         kind: TRANSFORMATION, phase: v0.1, traps: [union_all]}
  - {from: stg_payments.order_id,    to: int_payment_events.order_id,         kind: IDENTITY,       phase: v0.1, traps: [union_all]}
  - {from: stg_refunds.order_id,     to: int_payment_events.order_id,         kind: IDENTITY,       phase: v0.1, traps: [union_all]}
  - {from: stg_payments.amount_usd,  to: int_payment_events.event_amount_usd, kind: RENAME,         phase: v0.1, traps: [union_all]}
  - {from: stg_refunds.refund_amt,   to: int_payment_events.event_amount_usd, kind: TRANSFORMATION, phase: v0.1, traps: [union_all]}
  - {from: stg_payments.paid_at,     to: int_payment_events.event_at,         kind: RENAME,         phase: v0.1, traps: [union_all]}
  - {from: stg_refunds.refunded_at,  to: int_payment_events.event_at,         kind: RENAME,         phase: v0.1, traps: [union_all]}

  # int_order_financials  <- int_orders_enriched LEFT JOIN refunds-per-order LEFT JOIN payment-events-per-order
  - {from: int_orders_enriched.order_id,           to: int_order_financials.order_id,           kind: IDENTITY,       phase: v0.1, traps: []}
  - {from: int_orders_enriched.customer_id,        to: int_order_financials.customer_id,        kind: IDENTITY,       phase: v0.1, traps: []}
  - {from: int_orders_enriched.order_date,         to: int_order_financials.order_date,         kind: IDENTITY,       phase: v0.1, traps: []}
  - {from: int_orders_enriched.order_status_group, to: int_order_financials.order_status_group, kind: IDENTITY,       phase: v0.1, traps: []}
  - {from: int_orders_enriched.item_count,         to: int_order_financials.item_count,         kind: IDENTITY,       phase: v0.1, traps: []}
  - {from: int_orders_enriched.items_subtotal,     to: int_order_financials.items_subtotal,     kind: IDENTITY,       phase: v0.1, traps: [deep_chain]}
  - {from: int_orders_enriched.order_tax,          to: int_order_financials.sales_tax,          kind: RENAME,         phase: v0.1, traps: [rename_chain]}
  - {from: int_orders_enriched.items_subtotal,     to: int_order_financials.order_total,        kind: TRANSFORMATION, phase: v0.1, traps: []}
  - {from: int_orders_enriched.order_tax,          to: int_order_financials.order_total,        kind: TRANSFORMATION, phase: v0.1, traps: []}
  - {from: stg_refunds.refund_amt,                 to: int_order_financials.refund_amount,      kind: AGGREGATION,    phase: v0.1, traps: [near_duplicate_names]}
  - {from: int_payment_events.event_amount_usd,    to: int_order_financials.net_paid_usd,       kind: AGGREGATION,    phase: v0.1, traps: []}

  # int_customer_order_history  <- SELECT *, lag(order_date) OVER (...) FROM int_order_financials
  - {from: int_order_financials.order_id,           to: int_customer_order_history.order_id,            kind: IDENTITY,       phase: v0.1, traps: [select_star]}
  - {from: int_order_financials.customer_id,        to: int_customer_order_history.customer_id,         kind: IDENTITY,       phase: v0.1, traps: [select_star]}
  - {from: int_order_financials.order_date,         to: int_customer_order_history.order_date,          kind: IDENTITY,       phase: v0.1, traps: [select_star]}
  - {from: int_order_financials.order_status_group, to: int_customer_order_history.order_status_group,  kind: IDENTITY,       phase: v0.1, traps: [select_star]}
  - {from: int_order_financials.item_count,         to: int_customer_order_history.item_count,          kind: IDENTITY,       phase: v0.1, traps: [select_star]}
  - {from: int_order_financials.items_subtotal,     to: int_customer_order_history.items_subtotal,      kind: IDENTITY,       phase: v0.1, traps: [select_star, deep_chain]}
  - {from: int_order_financials.sales_tax,          to: int_customer_order_history.sales_tax,           kind: IDENTITY,       phase: v0.1, traps: [select_star]}
  - {from: int_order_financials.order_total,        to: int_customer_order_history.order_total,         kind: IDENTITY,       phase: v0.1, traps: [select_star]}
