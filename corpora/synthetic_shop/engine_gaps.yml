# Known engine-vs-gold disagreements on synthetic_shop v2 (S02b, item 7). NOT gold: the gold is
# lineage_spec.yml. Each entry is a parser gap, classified by hand: the SQL matches DESIGN_v2
# Appendix C and the gold is right. The 15 frozen v1 models must match the gold exactly and never
# appear here.
#
# Tests assert that the observed disagreements EQUAL this file: a new gap fails, and a fixed gap
# fails until its entry is removed (tests/integration/test_synthetic_shop.py, test_tools_synthetic.py).
#
# direct_edges.engine: extra (engine has a direct edge the gold lacks), missing (gold direct edge
#   the engine lacks), wrong_kind (both have it, kinds differ). gold_kind is null for `extra`;
#   gold_indirect names the indirect type the gold uses for that pair instead.

direct_edges: []  # S04: the 4 kind gaps (scalar-subquery leak, sum(sum(x)) OVER) are fixed

# Edges the engine cites at model level (Edge.model_level_citation) instead of a SQL line.
# lineage/provenance.py recognises `*` and `t.*` as star items, not `* EXCLUDE (...)`.
model_level_citations:
  - {from: int_order_profit.order_id, to: fct_order_margins.order_id, construct: "SELECT * EXCLUDE (...)", target: S04}
  - {from: int_order_profit.customer_id, to: fct_order_margins.customer_id, construct: "SELECT * EXCLUDE (...)", target: S04}
  - {from: int_order_profit.order_date, to: fct_order_margins.order_date, construct: "SELECT * EXCLUDE (...)", target: S04}
  - {from: int_order_profit.net_revenue, to: fct_order_margins.net_revenue, construct: "SELECT * EXCLUDE (...)", target: S04}
  - {from: int_order_profit.cogs_total, to: fct_order_margins.cogs_total, construct: "SELECT * EXCLUDE (...)", target: S04}
  - {from: int_order_profit.gross_margin, to: fct_order_margins.gross_margin, construct: "SELECT * EXCLUDE (...)", target: S04}
  - {from: int_order_profit.shipping_cost_total, to: fct_order_margins.shipping_cost_total, construct: "SELECT * EXCLUDE (...)", target: S04}
  - {from: int_order_profit.discount_total, to: fct_order_margins.discount_total, construct: "SELECT * EXCLUDE (...)", target: S04}
  - {from: int_order_profit.contribution_margin, to: fct_order_margins.contribution_margin, construct: "SELECT * EXCLUDE (...)", target: S04}

# Indirect edges (S03, ADR 0020). Asserted equal to what the engine does: the citation entry is
# present iff every indirect edge carries a model-level citation (no clause locator yet).
indirect_edges:
  - {gap: "indirect-edge clause citations are model-level", construct: "JOIN/WHERE/GROUP BY/OVER/... clause lines", target: S04}
