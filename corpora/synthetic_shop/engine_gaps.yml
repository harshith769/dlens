# Known engine-vs-gold disagreements on synthetic_shop v2 (S02b, item 7). NOT gold: the gold is
# lineage_spec.yml. Each entry is a parser gap, classified by hand: the SQL matches DESIGN_v2
# Appendix C and the gold is right. The 15 frozen v1 models must match the gold exactly and never
# appear here.
#
# Tests assert that the observed disagreements EQUAL this file: a new gap fails, and a fixed gap
# fails until its entry is removed (tests/integration/test_synthetic_shop.py, test_tools_synthetic.py).
#
# S04 closed every gap, so all three lists are empty. The file, its schema and the equality tests
# stay: a future corpus (or a regression here) records its gaps in the same shape.
#
# direct_edges.engine: extra (engine has a direct edge the gold lacks), missing (gold direct edge
#   the engine lacks), wrong_kind (both have it, kinds differ). gold_kind is null for `extra`;
#   gold_indirect names the indirect type the gold uses for that pair instead.

direct_edges: []  # S04: the 4 kind gaps (scalar-subquery leak, sum(sum(x)) OVER) are fixed

# Edges the engine cites at model level (Edge.model_level_citation) instead of a SQL line.
# lineage/provenance.py recognises `*`, `t.*` and their EXCLUDE / REPLACE forms as star items.
model_level_citations: []  # S04: provenance reads * EXCLUDE / REPLACE (fct_order_margins)

# Indirect edges (S03, ADR 0020). Asserted equal to what the engine does: the citation entry is
# present iff some indirect edge carries a model-level citation (ModelParse.citation_gaps says why).
indirect_edges: []  # S04: the clause locator cites every indirect edge at its clause's lines
