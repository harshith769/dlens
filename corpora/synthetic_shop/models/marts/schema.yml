version: 2

models:
  - name: fct_orders
    columns:
      - name: order_id
        tests:
          - unique
          - not_null

  - name: dim_customers
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null

  - name: fct_daily_revenue
    columns:
      - name: order_date
        tests:
          - unique
          - not_null

  - name: fct_payment_events
    columns:
      - name: event_id
        tests:
          - unique
          - not_null
