# End-to-end columns in a seed column's gold closure that no mode changed and no local category-B
# pair explains. Listed, not gated (ADR 0017; owner, 17 Oct 2026). One likely reason per group,
# drafted in S05 at the owner's request; the report shows it under the table. Every unexplained
# (seed, column) must fall in a group.
e2e_unexplained:
  - seeds: [raw_order_items.order_id, raw_order_items.product_id, raw_order_items.quantity,
            raw_order_items.unit_price, raw_orders.tax_usd, raw_products.id, raw_refunds.order_id,
            raw_refunds.refund_amt]
    targets: [dim_customer_segments.customer_segment, fct_segment_monthly.active_customers,
              fct_segment_monthly.customer_segment, fct_segment_monthly.order_month,
              fct_segment_monthly.segment_order_count, fct_segment_monthly.segment_revenue_finance]
    reason: >-
      Absorbed by a threshold downstream: these seeds move lifetime_value, so only
      rfm_monetary_score changes; it is the units digit of rfm_score (1-3) and the segment
      cut-offs 330 / 220 are multiples of 10, so no customer changes segment (checked per
      customer in S05) and the segment-keyed columns of fct_segment_monthly keep their values.
  - seeds: [raw_product_costs.valid_from]
    targets: [fct_top_products.product_id, fct_top_products.product_name, fct_top_products.units_sold]
    reason: >-
      Absorbed by LIMIT 10: the current-cost change moves gross_margin (observed) but not which
      products make the top 10.
  - seeds: [raw_web_sessions.started_at, raw_web_sessions.channel, raw_web_sessions.page_views,
            raw_web_sessions.is_bot]
    targets: [fct_marketing_attribution.channel, fct_marketing_attribution.report_date,
              fct_marketing_attribution.spend_usd, fct_channel_performance_monthly.channel,
              fct_channel_performance_monthly.report_month, fct_channel_performance_monthly.spend_usd]
    reason: >-
      Row-preserving LEFT JOIN from the spend side: locally these pairs show only through fan-out
      when a perturbed int_sessions_daily key stops being unique; a seed change is re-aggregated
      by its GROUP BY, keys stay unique, and spend rows keep their values.

# Shown under "Possible later strengthening" in the report (owner, 17 Oct 2026).
later_strengthening:
  - >-
    A tie probe (create ties on the primary order key) would make the 7 tie-breaker pairs
    observable.
