# Owner decisions for the perturbation oracle on synthetic_shop (S05, A4).
#
# Written from the owner's decisions of 17 Oct 2026 (S05 session). Only the owner decides an entry;
# the oracle never edits this file and nobody derives entries from parser output.
#
# category_a: observed changes not in the gold (spec bug or SQL drift) with the owner's decision.
# category_b: gold pairs the local check did not observe and no certain auto-tag explains.
#   Fields: from, to, check (local | e2e), labels (gold labels of the pair), reason_label, reason,
#   decision, decided, note (optional).
# tests/integration/test_oracle.py asserts that the untagged local category-B cases EQUAL this list
# (a new case fails; a case that becomes observed fails until its entry is removed) and that every
# category-A case has a decision. ORACLE_REPORT.md renders its Owner decisions section from here.
#
# Spot-check (owner, 17 Oct 2026): all 10 sampled row_preserving_join cases confirmed.

